<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0b0f"/>
      <stop offset="100%" style="stop-color:#1a1d29"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#065f46"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#4c1d95"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#92400e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.08)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.03)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#bg)"/>

  <!-- Ambient glows -->
  <ellipse cx="160" cy="210" rx="120" ry="100" fill="#10b981" opacity="0.06"/>
  <ellipse cx="400" cy="180" rx="140" ry="110" fill="#00d4ff" opacity="0.05"/>
  <ellipse cx="640" cy="210" rx="120" ry="100" fill="#7c3aed" opacity="0.07"/>

  <!-- Dot pattern -->
  <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.04)"/>
  </pattern>
  <rect width="800" height="420" fill="url(#dots)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.04" stroke="#00d4ff" stroke-width="0.5">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="420"/>
    <line x1="320" y1="0" x2="320" y2="420"/>
    <line x1="480" y1="0" x2="480" y2="420"/>
    <line x1="640" y1="0" x2="640" y2="420"/>
  </g>

  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="3" fill="url(#cyanGrad)"/>

  <!-- Title area -->
  <text x="400" y="36" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" filter="url(#glow)">Pi Backups: Restore Drills</text>
  <text x="400" y="56" font-family="Inter, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Automated disaster recovery testing — proof that your backups actually work</text>

  <!-- ======= STEP 1: Remote Server ======= -->
  <rect x="22" y="78" width="130" height="170" rx="10" fill="rgba(26,29,41,0.9)" stroke="#10b981" stroke-width="1.5"/>
  <rect x="22" y="78" width="130" height="4" rx="2" fill="url(#greenGrad)"/>
  <text x="87" y="102" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#10b981" text-anchor="middle">REMOTE SERVER</text>

  <!-- Server icon -->
  <rect x="52" y="112" width="70" height="12" rx="3" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="1"/>
  <circle cx="62" cy="118" r="2.5" fill="#10b981"/>
  <rect x="52" y="128" width="70" height="12" rx="3" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="1"/>
  <circle cx="62" cy="134" r="2.5" fill="#10b981"/>
  <rect x="52" y="144" width="70" height="12" rx="3" fill="rgba(16,185,129,0.15)" stroke="#475569" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="62" cy="150" r="2.5" fill="#475569"/>

  <!-- Archive file icon -->
  <rect x="63" y="163" width="48" height="38" rx="4" fill="rgba(0,212,255,0.1)" stroke="#00d4ff" stroke-width="1"/>
  <text x="87" y="179" font-family="Inter, monospace" font-size="7" fill="#00d4ff" text-anchor="middle" font-weight="600">.tar.gz</text>
  <text x="87" y="190" font-family="Inter, monospace" font-size="7" fill="#7c3aed" text-anchor="middle">.gpg</text>
  <text x="87" y="201" font-family="Inter, monospace" font-size="6" fill="#64748b" text-anchor="middle">AES-256</text>

  <text x="87" y="240" font-family="Inter, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Encrypted archive</text>

  <!-- Step label -->
  <rect x="30" y="254" width="114" height="18" rx="5" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1"/>
  <text x="87" y="266" font-family="Inter, sans-serif" font-size="8" fill="#10b981" text-anchor="middle" font-weight="600">① Backup Destination</text>

  <!-- Arrow 1 -->
  <line x1="152" y1="163" x2="188" y2="163" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>
  <polygon points="186,158 196,163 186,168" fill="#00d4ff" opacity="0.7"/>
  <text x="170" y="155" font-family="Inter, sans-serif" font-size="7" fill="#64748b" text-anchor="middle">rsync</text>
  <text x="170" y="145" font-family="Inter, sans-serif" font-size="7" fill="#64748b" text-anchor="middle">download</text>

  <!-- ======= STEP 2: Decrypt ======= -->
  <rect x="196" y="78" width="120" height="170" rx="10" fill="rgba(26,29,41,0.9)" stroke="#00d4ff" stroke-width="1.5"/>
  <rect x="196" y="78" width="120" height="4" rx="2" fill="url(#cyanGrad)"/>
  <text x="256" y="102" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#00d4ff" text-anchor="middle">② DECRYPT</text>

  <!-- Lock icon -->
  <rect x="236" y="113" width="40" height="32" rx="5" fill="rgba(0,212,255,0.15)" stroke="#00d4ff" stroke-width="1.5"/>
  <path d="M244,113 Q244,100 256,100 Q268,100 268,113" fill="none" stroke="#00d4ff" stroke-width="2"/>
  <circle cx="256" cy="129" r="5" fill="#00d4ff" opacity="0.9"/>
  <line x1="256" y1="129" x2="256" y2="136" stroke="#00d4ff" stroke-width="2"/>

  <text x="256" y="163" font-family="Inter, monospace" font-size="8" fill="#94a3b8" text-anchor="middle">gpg --decrypt</text>
  <text x="256" y="175" font-family="Inter, monospace" font-size="8" fill="#94a3b8" text-anchor="middle">--passphrase-file</text>
  <text x="256" y="187" font-family="Inter, monospace" font-size="8" fill="#64748b" text-anchor="middle">.gpg-pass</text>

  <text x="256" y="210" font-family="Inter, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Temp directory</text>
  <text x="256" y="222" font-family="Inter, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">/tmp/pi-drill-*</text>

  <rect x="204" y="234" width="104" height="18" rx="5" fill="rgba(0,212,255,0.12)" stroke="#00d4ff" stroke-width="1"/>
  <text x="256" y="246" font-family="Inter, sans-serif" font-size="8" fill="#00d4ff" text-anchor="middle" font-weight="600">AES-256 passphrase</text>

  <!-- Arrow 2 -->
  <line x1="316" y1="163" x2="350" y2="163" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>
  <polygon points="348,158 358,163 348,168" fill="#7c3aed" opacity="0.7"/>

  <!-- ======= STEP 3: Extract ======= -->
  <rect x="358" y="78" width="120" height="170" rx="10" fill="rgba(26,29,41,0.9)" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="358" y="78" width="120" height="4" rx="2" fill="url(#purpleGrad)"/>
  <text x="418" y="102" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#7c3aed" text-anchor="middle">③ EXTRACT</text>

  <!-- Folder/files icon -->
  <rect x="398" y="112" width="40" height="30" rx="4" fill="rgba(124,58,237,0.2)" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="394" y="108" width="20" height="8" rx="3" fill="rgba(124,58,237,0.3)" stroke="#7c3aed" stroke-width="1"/>
  <line x1="404" y1="121" x2="430" y2="121" stroke="#7c3aed" stroke-width="0.8" opacity="0.6"/>
  <line x1="404" y1="128" x2="428" y2="128" stroke="#7c3aed" stroke-width="0.8" opacity="0.6"/>
  <line x1="404" y1="135" x2="422" y2="135" stroke="#7c3aed" stroke-width="0.8" opacity="0.6"/>

  <text x="418" y="163" font-family="Inter, monospace" font-size="8" fill="#94a3b8" text-anchor="middle">tar xzf archive</text>
  <text x="418" y="175" font-family="Inter, monospace" font-size="8" fill="#94a3b8" text-anchor="middle">-C /tmp/drill/</text>

  <text x="418" y="197" font-family="Inter, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Restores full</text>
  <text x="418" y="209" font-family="Inter, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">directory tree</text>

  <rect x="366" y="234" width="104" height="18" rx="5" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="1"/>
  <text x="418" y="246" font-family="Inter, sans-serif" font-size="8" fill="#7c3aed" text-anchor="middle" font-weight="600">tar xzf decompress</text>

  <!-- Arrow 3 -->
  <line x1="478" y1="163" x2="512" y2="163" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>
  <polygon points="510,158 520,163 510,168" fill="#f59e0b" opacity="0.7"/>

  <!-- ======= STEP 4: Verify ======= -->
  <rect x="520" y="78" width="120" height="170" rx="10" fill="rgba(26,29,41,0.9)" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="520" y="78" width="120" height="4" rx="2" fill="url(#amberGrad)"/>
  <text x="580" y="102" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#f59e0b" text-anchor="middle">④ VERIFY</text>

  <!-- Checkmark items -->
  <g font-family="Inter, sans-serif" font-size="8" fill="#94a3b8">
    <text x="536" y="122">✓</text>
    <text x="548" y="122">File count matches</text>
    <text x="536" y="137">✓</text>
    <text x="548" y="137">Total size within 5%</text>
    <text x="536" y="152">✓</text>
    <text x="548" y="152">Key files present</text>
    <text x="536" y="167">✓</text>
    <text x="548" y="167">No corrupt entries</text>
  </g>

  <text x="580" y="192" font-family="Inter, monospace" font-size="8" fill="#64748b" text-anchor="middle">find + wc -l + du</text>
  <text x="580" y="204" font-family="Inter, monospace" font-size="8" fill="#64748b" text-anchor="middle">compare to baseline</text>

  <rect x="528" y="220" width="104" height="18" rx="5" fill="rgba(245,158,11,0.12)" stroke="#f59e0b" stroke-width="1"/>
  <text x="580" y="232" font-family="Inter, sans-serif" font-size="8" fill="#f59e0b" text-anchor="middle" font-weight="600">4 verification checks</text>

  <rect x="528" y="242" width="104" height="18" rx="5" fill="rgba(16,185,129,0.12)" stroke="#10b981" stroke-width="1"/>
  <text x="580" y="254" font-family="Inter, sans-serif" font-size="8" fill="#10b981" text-anchor="middle" font-weight="600">rm -rf /tmp/drill-*</text>

  <!-- Arrow 4 -->
  <line x1="640" y1="163" x2="668" y2="163" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>
  <polygon points="666,158 676,163 666,168" fill="#10b981" opacity="0.7"/>

  <!-- ======= STEP 5: Telegram Report ======= -->
  <rect x="676" y="78" width="106" height="170" rx="10" fill="rgba(26,29,41,0.9)" stroke="#10b981" stroke-width="1.5"/>
  <rect x="676" y="78" width="106" height="4" rx="2" fill="url(#greenGrad)"/>
  <text x="729" y="102" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#10b981" text-anchor="middle">⑤ REPORT</text>

  <!-- Telegram message bubble - success -->
  <rect x="686" y="110" width="86" height="60" rx="8" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1"/>
  <text x="729" y="125" font-family="Inter, sans-serif" font-size="8" fill="#10b981" text-anchor="middle" font-weight="700">✅ Drill PASSED</text>
  <text x="729" y="137" font-family="Inter, monospace" font-size="7" fill="#94a3b8" text-anchor="middle">Job: family-dash</text>
  <text x="729" y="148" font-family="Inter, monospace" font-size="7" fill="#94a3b8" text-anchor="middle">Files: 847/847</text>
  <text x="729" y="159" font-family="Inter, monospace" font-size="7" fill="#94a3b8" text-anchor="middle">Time: 38s</text>

  <!-- failure bubble -->
  <rect x="686" y="178" width="86" height="42" rx="8" fill="rgba(239,68,68,0.1)" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="729" y="193" font-family="Inter, sans-serif" font-size="8" fill="#ef4444" text-anchor="middle" font-weight="700">⚠️ Drill FAILED</text>
  <text x="729" y="205" font-family="Inter, monospace" font-size="7" fill="#94a3b8" text-anchor="middle">Missing 12 files</text>
  <text x="729" y="216" font-family="Inter, monospace" font-size="7" fill="#94a3b8" text-anchor="middle">exit 1 → alert</text>

  <rect x="684" y="234" width="88" height="18" rx="5" fill="rgba(16,185,129,0.12)" stroke="#10b981" stroke-width="1"/>
  <text x="728" y="246" font-family="Inter, sans-serif" font-size="8" fill="#10b981" text-anchor="middle" font-weight="600">tg_notify()</text>

  <!-- ======= BOTTOM CRON ROW ======= -->
  <rect x="22" y="300" width="756" height="48" rx="10" fill="rgba(26,29,41,0.7)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="40" y="320" font-family="Inter, monospace" font-size="9" fill="#64748b"># crontab</text>
  <text x="40" y="338" font-family="Inter, monospace" font-size="9" fill="#00d4ff">0 3 1 * *</text>
  <text x="108" y="338" font-family="Inter, monospace" font-size="9" fill="#94a3b8">/opt/pi-backups/restore-drill.sh</text>
  <text x="380" y="338" font-family="Inter, monospace" font-size="9" fill="#475569">  # 1st of every month at 03:00</text>
  <text x="640" y="320" font-family="Inter, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Monthly automated</text>
  <text x="640" y="334" font-family="Inter, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">restore verification</text>

  <!-- ======= BOTTOM BADGE ROW ======= -->
  <g font-family="Inter, sans-serif" font-size="9" font-weight="600">
    <rect x="22" y="360" width="80" height="20" rx="5" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1"/>
    <text x="62" y="374" fill="#10b981" text-anchor="middle">Bash Shell</text>

    <rect x="112" y="360" width="64" height="20" rx="5" fill="rgba(0,212,255,0.15)" stroke="#00d4ff" stroke-width="1"/>
    <text x="144" y="374" fill="#00d4ff" text-anchor="middle">GPG Decrypt</text>

    <rect x="186" y="360" width="60" height="20" rx="5" fill="rgba(124,58,237,0.15)" stroke="#7c3aed" stroke-width="1"/>
    <text x="216" y="374" fill="#7c3aed" text-anchor="middle">rsync / scp</text>

    <rect x="256" y="360" width="70" height="20" rx="5" fill="rgba(245,158,11,0.15)" stroke="#f59e0b" stroke-width="1"/>
    <text x="291" y="374" fill="#f59e0b" text-anchor="middle">Auto-cleanup</text>

    <rect x="336" y="360" width="70" height="20" rx="5" fill="rgba(239,68,68,0.12)" stroke="#ef4444" stroke-width="1"/>
    <text x="371" y="374" fill="#ef4444" text-anchor="middle">Failure Alerts</text>

    <rect x="416" y="360" width="66" height="20" rx="5" fill="rgba(16,185,129,0.12)" stroke="#10b981" stroke-width="1"/>
    <text x="449" y="374" fill="#10b981" text-anchor="middle">Monthly Cron</text>

    <rect x="492" y="360" width="72" height="20" rx="5" fill="rgba(0,212,255,0.12)" stroke="#00d4ff" stroke-width="1"/>
    <text x="528" y="374" fill="#00d4ff" text-anchor="middle">Drill Log File</text>

    <rect x="574" y="360" width="78" height="20" rx="5" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="1"/>
    <text x="613" y="374" fill="#7c3aed" text-anchor="middle">Telegram Report</text>

    <rect x="662" y="360" width="60" height="20" rx="5" fill="rgba(245,158,11,0.12)" stroke="#f59e0b" stroke-width="1"/>
    <text x="692" y="374" fill="#f59e0b" text-anchor="middle">Self-Hosted</text>
  </g>

  <!-- Footer -->
  <text x="400" y="410" font-family="Inter, sans-serif" font-size="8" fill="#475569" text-anchor="middle">josefresco.com · github.com/josefresco/pi-backups</text>
</svg>
