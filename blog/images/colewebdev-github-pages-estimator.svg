  <rect x="287" y="290" width="245" height="148" rx="12" fill="url(#box-grad)" stroke="rgba(124,58,237,0.45)" stroke-width="1.5"/>
  <rect x="287" y="290" width="245" height="38" rx="12" fill="rgba(124,58,237,0.1)"/>
  <rect x="287" y="316" width="245" height="12" fill="rgba(124,58,237,0.1)"/>
  <text x="409" y="313" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="middle">AI Showcase</text>
  <text x="409" y="347" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Highlights AI-assisted workflows</text>
  <text x="409" y="363" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Tab switcher · before/after panels</text>
  <text x="409" y="379" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">useReducer for tab state</text>
  <text x="409" y="395" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">CSS transitions, no animation lib</text>
  <rect x="309" y="410" width="200" height="18" rx="9" fill="rgba(124,58,237,0.15)" stroke="rgba(124,58,237,0.35)" stroke-width="1"/>
  <text x="409" y="423" font-family="Inter, sans-serif" font-size="10" fill="#a78bfa" text-anchor="middle" font-weight="600">parts-services.jsx · &lt;AIShowcase /&gt;</text>

  <!-- Newsletter Banner -->
  <rect x="546" y="290" width="245" height="148" rx="12" fill="url(#box-grad)" stroke="rgba(16,185,129,0.45)" stroke-width="1.5"/>
  <rect x="546" y="290" width="245" height="38" rx="12" fill="rgba(16,185,129,0.1)"/>
  <rect x="546" y="316" width="245" height="12" fill="rgba(16,185,129,0.1)"/>
  <text x="668" y="313" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#10b981" text-anchor="middle">Newsletter Banner</text>
  <text x="668" y="347" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Sticky bottom bar · dismissible</text>
  <text x="668" y="363" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">sessionStorage dismiss flag</text>
  <text x="668" y="379" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Email capture → mailto fallback</text>
  <text x="668" y="395" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Respects prefers-reduced-motion</text>
  <rect x="568" y="410" width="200" height="18" rx="9" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.35)" stroke-width="1"/>
  <text x="668" y="423" font-family="Inter, sans-serif" font-size="10" fill="#10b981" text-anchor="middle" font-weight="600">app.jsx · &lt;NewsletterBanner /&gt;</text>

  <!-- GitHub Pages zero-config badge -->
  <rect x="805" y="290" width="362" height="148" rx="12" fill="url(#box-grad)" stroke="rgba(0,212,255,0.3)" stroke-width="1.5"/>
  <text x="986" y="318" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#00d4ff" text-anchor="middle">Zero-Config Deployment</text>
  <text x="986" y="341" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">No GitHub Actions YAML needed</text>
  <text x="986" y="359" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">No build artifacts to manage</text>
  <text x="986" y="377" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">git push origin main → live in 30s</text>
  <!-- mini code block -->
  <rect x="830" y="392" width="312" height="32" rx="6" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="986" y="412" font-family="'Courier New', monospace" font-size="11" fill="#00d4ff" text-anchor="middle">$ git push origin main</text>

  <!-- Bottom tech badges -->
  <rect x="60" y="476" width="148" height="26" rx="13" fill="rgba(0,212,255,0.1)" stroke="rgba(0,212,255,0.3)" stroke-width="1"/>
  <text x="134" y="494" font-family="Inter, sans-serif" font-size="11" fill="#00d4ff" text-anchor="middle" font-weight="600">React 18 via CDN</text>

  <rect x="222" y="476" width="148" height="26" rx="13" fill="rgba(245,158,11,0.1)" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
  <text x="296" y="494" font-family="Inter, sans-serif" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="600">Babel Standalone</text>

  <rect x="384" y="476" width="128" height="26" rx="13" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <text x="448" y="494" font-family="Inter, sans-serif" font-size="11" fill="#a78bfa" text-anchor="middle" font-weight="600">GitHub Pages</text>

  <rect x="526" y="476" width="128" height="26" rx="13" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="590" y="494" font-family="Inter, sans-serif" font-size="11" fill="#10b981" text-anchor="middle" font-weight="600">Zero npm</text>

  <rect x="668" y="476" width="148" height="26" rx="13" fill="rgba(0,212,255,0.1)" stroke="rgba(0,212,255,0.3)" stroke-width="1"/>
  <text x="742" y="494" font-family="Inter, sans-serif" font-size="11" fill="#00d4ff" text-anchor="middle" font-weight="600">230+ Commits</text>

  <rect x="830" y="476" width="180" height="26" rx="13" fill="rgba(245,158,11,0.1)" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
  <text x="920" y="494" font-family="Inter, sans-serif" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="600">Cape Cod · 15 Towns</text>

