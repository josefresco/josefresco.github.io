<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0b0f"/>
      <stop offset="100%" style="stop-color:#1a1d29"/>
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
    <linearGradient id="green-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="box-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.08)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.03)"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" x="0" y="0" width="40" height="40">
      <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.04)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="200" cy="280" r="340" fill="rgba(124,58,237,0.06)"/>
  <circle cx="1000" cy="180" r="280" fill="rgba(0,212,255,0.06)"/>
  <circle cx="600" cy="550" r="200" fill="rgba(245,158,11,0.04)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Title -->
  <text x="600" y="58" font-family="Inter, sans-serif" font-size="30" font-weight="700" fill="white" text-anchor="middle" filter="url(#glow)">COLEwebdev.org</text>
  <text x="600" y="87" font-family="Inter, sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">GitHub Pages Deployment · Project Cost Estimator · 230+ Commits</text>
  <rect x="480" y="97" width="240" height="2" rx="1" fill="url(#cyan-grad)"/>

  <!-- STEP 1: Edit -->
  <text x="118" y="140" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="1">STEP 1</text>
  <rect x="28" y="150" width="180" height="96" rx="12" fill="url(#box-grad)" stroke="rgba(0,212,255,0.4)" stroke-width="1.5"/>
  <text x="118" y="174" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#00d4ff" text-anchor="middle">Edit JSX Files</text>
  <text x="118" y="193" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">tweaks-panel.jsx</text>
  <text x="118" y="209" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">parts-services.jsx</text>
  <text x="118" y="225" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">app.jsx … any editor</text>

  <!-- Arrow 1→2 -->
