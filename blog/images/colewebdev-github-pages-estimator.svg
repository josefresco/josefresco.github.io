  <polygon points="265,193 276,198 265,203" fill="rgba(0,212,255,0.7)"/>
  <text x="243" y="190" font-family="Inter, sans-serif" font-size="9" fill="#475569" text-anchor="middle">git push</text>

  <!-- STEP 2: GitHub Pages -->
  <text x="370" y="140" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="1">STEP 2</text>
  <rect x="278" y="150" width="184" height="96" rx="12" fill="url(#box-grad)" stroke="rgba(124,58,237,0.5)" stroke-width="1.5"/>
  <text x="370" y="174" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="middle">GitHub Pages</text>
  <text x="370" y="193" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">No build step required</text>
  <text x="370" y="209" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">No GitHub Actions YAML</text>
  <text x="370" y="225" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Files served as-is</text>

  <!-- Arrow 2→3 -->
  <line x1="464" y1="198" x2="522" y2="198" stroke="rgba(124,58,237,0.5)" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="519,193 530,198 519,203" fill="rgba(124,58,237,0.7)"/>
  <text x="493" y="190" font-family="Inter, sans-serif" font-size="9" fill="#475569" text-anchor="middle">CDN fetch</text>

  <!-- STEP 3: Browser -->
  <text x="640" y="140" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="1">STEP 3</text>
  <rect x="532" y="150" width="216" height="96" rx="12" fill="url(#box-grad)" stroke="rgba(0,212,255,0.55)" stroke-width="2"/>
  <rect x="532" y="150" width="216" height="30" rx="12" fill="rgba(0,212,255,0.08)"/>
  <rect x="532" y="170" width="216" height="10" fill="rgba(0,212,255,0.08)"/>
  <circle cx="549" cy="165" r="4" fill="rgba(255,90,90,0.6)"/>
  <circle cx="562" cy="165" r="4" fill="rgba(255,200,50,0.6)"/>
  <circle cx="575" cy="165" r="4" fill="rgba(80,200,80,0.6)"/>
  <text x="640" y="203" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#00d4ff" text-anchor="middle">Browser Renders</text>
